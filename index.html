<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的 AI Agent 使用报告</title>
  <style>
    body {
      margin: 0;
      background: #10131c;
      color: #f4f6fb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 80px 24px;
    }
    h1 {
      font-size: 56px;
      line-height: 1.1;
      background: linear-gradient(90deg, #9cf2cf, #aab8ff);
      background-clip: text;
      color: transparent;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    .card {
      padding: 24px;
      border: 1px solid #ffffff18;
      border-radius: 18px;
      background: #ffffff08;
    }
  </style>
</head>
<body>
  <main>
    <p>PERSONAL AI AGENT REPORT</p>
    <h1>我的 AI Agent 使用报告</h1>
    <p>以 WorkBuddy 为主，用 Trae 辅助编码与项目探索。</p>

    <div class="grid">
      <article class="card">
        <h2>WorkBuddy</h2>
        <p>资料研究、文档报告、表格处理与多步骤办公任务。</p>
      </article>
      <article class="card">
        <h2>Trae</h2>
        <p>代码编写、代码理解、调试与项目探索。</p>
      </article>
    </div>
  </main>
</body>
</html>
